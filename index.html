    <model-viewer id="model" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral"
        shadow-intensity="1" min-camera-orbit="auto 0deg 1000m" camera-orbit="0.381deg 75deg 1300m"
        max-camera-orbit="auto 90deg 2200m" min-field-of-view="1deg" poster="Ministry-of-Sports-1.png" near-plane="0.1m"
        far-plane="1500m">
        <script>
            const viewer = document.getElementById("model");

            // كشف إذا الجهاز جوال
            const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

            // تحديد المودل
            if (isMobile) {
                viewer.src = "model/045_King_Abdullah_Stadium-v2.glb";
            } else {
                viewer.src = "model/045_King_Abdullah_Stadium-v2.glb";
            }

            function toggleHotspots(type, btn) {
                // تأكد أن id الموديل هنا مطابق لـ id الموديل في HTML
                const viewer = document.getElementById("model");

                if (!viewer) {
                    console.error("لم يتم العثور على عنصر الموديل! تأكد من الـ id");
                    return;
                }

                if (type === 'parking') {
                    viewer.classList.toggle('show-parking');
                    console.log("تم تبديل ظهور المواقف"); // للتأكد في الكونسول
                } else if (type === 'stadium') {
                    viewer.classList.toggle('show-stadium');
                    console.log("تم تبديل ظهور الكاميرات");

                }
                btn.classList.toggle('active');
            }
        </script>

      زر التحكم في "مواقف السيارات":

      2. الكلاس 'side-btn': يعطيه الشكل الدائري والتصميم الموحد.
    -->
